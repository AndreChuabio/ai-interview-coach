# Deploy Python backend to Azure App Service.
# Packages are pre-built on GitHub runners (fast, plenty of RAM) and shipped
# inside the artifact so we do NOT depend on Azure Oryx build -- Oryx times
# out installing PyTorch + sentence-transformers on the constrained B1 tier.

name: Build and deploy Python app to Azure Web App - AI--Interview-Coach-Api

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'frontend/**'
      - '*.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create virtual environment and install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      # Include the venv in the artifact so Azure does not need to rebuild.
      # We exclude heavy caches and test files to keep the payload smaller.
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !.git/
            !frontend/
            !.github/
            !docs/
            !__pycache__/
            !*.md

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BA7D6FBF8F7544CD9EC01F54256923C6 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_64C0603E534B4860B282A63F1B18BEF6 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_DCBAADFA047C45FDA19F4CB244BD33D9 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'AI--Interview-Coach-Api'
          slot-name: 'Production'
          